name: Deploy Laravel to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Move Public Files
        run: |
          mkdir dist
          # 1. Salin semua aset dari folder public ke folder deploy
          cp -r public/* dist/
          
          # 2. HAPUS file index.php agar tidak membuat error di GitHub Pages
          rm dist/index.php || true
          
          # 3. AMBIL file portofolio asli Anda dari resources/views dan ubah menjadi index.html
          if [ -f resources/views/welcome.blade.php ]; then
            cp resources/views/welcome.blade.php dist/index.html
          fi
          
          # 4. Buat cadangan halaman untuk sistem router
          cp dist/index.html dist/404.html || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
