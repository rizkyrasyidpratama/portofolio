name: Deploy Laravel to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install NPM and Build Assets
        run: |
          npm install
          npm run build

      - name: Move Public Files
        run: |
          mkdir dist
          # 1. Menyalin semua hasil build dari server ke folder deploy
          cp -r public/. dist/

          # 2. Mengkonversi welcome.blade.php menjadi index.html secara bersih
          if [ -f resources/views/welcome.blade.php ]; then
            php -r "
              \$content = file_get_contents('resources/views/welcome.blade.php');
              
              // Cari file CSS dan JS hasil build otomatis di server
              \$cssFiles = glob('dist/build/assets/*.css');
              \$jsFiles = glob('dist/build/assets/*.js');
              
              \$cssLink = count(\$cssFiles) > 0 ? '/portofolio/build/assets/' . basename(\$cssFiles[0]) : '';
              \$jsSrc = count(\$jsFiles) > 0 ? '/portofolio/build/assets/' . basename(\$jsFiles[0]) : '';
              
              // Ganti teks @vite dengan tag HTML murni (mendukung kutip tunggal dan ganda)
              \$replacement = '';
              if (\$cssLink) \$replacement .= '<link rel=\"stylesheet\" href=\"' . \$cssLink . '\">';
              if (\$jsSrc) \$replacement .= '<script src=\"' . \$jsSrc . '\"></script>';
              
              \$content = preg_replace('/@vite\(.*?\)/s', \$replacement, \$content);
              
              file_put_contents('dist/index.html', \$content);
            "
          fi
          cp dist/index.html dist/404.html || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
