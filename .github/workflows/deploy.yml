name: Deploy Laravel to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Move Public Files
        run: |
          mkdir dist
          # 1. Menyalin semua hasil build dari folder public laptop ke folder deploy
          cp -r public/* dist/
          
          # 2. Mengubah sintaks Laravel @vite menjadi tag HTML link CSS asli secara otomatis
          if [ -f resources/views/welcome.blade.php ]; then
            php -r "
              \$content = file_get_contents('resources/views/welcome.blade.php');
              
              // Mencari nama file CSS dan JS unik hasil compiler Vite
              \$cssFiles = glob('public/build/assets/*.css');
              \$jsFiles = glob('public/build/assets/*.js');
              
              \$cssName = count(\$cssFiles) > 0 ? basename(\$cssFiles[0]) : '';
              \$jsName = count(\$jsFiles) > 0 ? basename(\$jsFiles[0]) : '';
              
              \$htmlTags = '';
              if (\$cssName) {
                \$htmlTags .= '<link rel=\"stylesheet\" href=\"/portofolio/build/assets/' . \$cssName . '\">';
              }
              if (\$jsName) {
                \$htmlTags .= '<script src=\"/portofolio/build/assets/' . \$jsName . '\"></script>';
              }
              
              // Ganti teks @vite dengan tag HTML link agar dimengerti GitHub Pages
              \$content = preg_replace('/@vite\(.*?\)/', \$htmlTags, \$content);
              
              file_put_contents('dist/index.html', \$content);
            "
          fi
          cp dist/index.html dist/404.html || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
