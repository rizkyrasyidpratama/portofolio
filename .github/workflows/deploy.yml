name: Deploy Laravel to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Move Public Files
        run: |
          mkdir dist
          # Langsung menyalin hasil rakitan dari laptop yang ada di folder public
          cp -r public/* dist/
          if [ -f resources/views/welcome.blade.php ]; then
            cp resources/views/welcome.blade.php dist/index.html
          fi
          cp dist/index.html dist/404.html || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
