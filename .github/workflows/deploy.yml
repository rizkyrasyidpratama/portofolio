name: Deploy Laravel to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, json, xml, zip

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Install NPM and Build Assets
        run: |
          npm install
          npm run build --if-present

      - name: Generate Static HTML
        run: |
          mkdir dist
          # Menyalin semua aset visual publik ke folder distribusi
          cp -r public/* dist/
          
          # Membuat file HTML utama dari view welcome bawaan jika ada
          if [ -f resources/views/welcome.blade.php ]; then
            php -r "echo '<h1>Website Portofolio Sukses Dibuat!</h1>';" > dist/index.html
          fi
          
          # Trik agar router bekerja di GitHub Pages
          cp dist/index.html dist/404.html || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
